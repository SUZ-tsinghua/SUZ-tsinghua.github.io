title: "Zhi Su"
locale: "en-US"
url: https://suz-tsinghua.github.io
timezone: Etc/UTC

# Shown in the sidebar on every page
author:
  name: "Zhi Su"
  avatar: "avatar.jpg" # in /images/
  email: "suz22.tsinghua@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=R5Y1xlUAAAAJ"
  github: "SUZ-tsinghua"
  twitter: "ZhiSu22"

# Headings on the publications page; each publication sets `category` to one of the keys
publication_category:
  lead:
    title: '(Co-)Led by Me'
  cooperation:
    title: 'Cooperations'

collections:
  - publications

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single

include:
  - _pages
exclude:
  - LICENSE
  - README.md

sass:
  style: compressed
  sourcemap: development # no main.css.map in production
