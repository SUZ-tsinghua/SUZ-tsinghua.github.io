<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    {% include head.html %}
  </head>

  <body>
    {% include masthead.html %}

    <main id="main">
      {% include sidebar.html %}
      {{ content }}
    </main>

    <footer class="page__footer">
      <div class="page__footer-copyright">
        &copy; {{ site.time | date: '%Y' }} {{ site.title }}, Powered by <a href="http://jekyllrb.com" rel="nofollow">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>, a fork of <a href="https://mademistakes.com/work/minimal-mistakes-jekyll-theme/" rel="nofollow">Minimal Mistakes</a>.<br />
        Site last updated {{ site.time | date: '%Y-%m-%d' }}
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
