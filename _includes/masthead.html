<header class="masthead">
  <nav class="masthead__nav">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
    {% endfor %}
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></button>
  </nav>
</header>
