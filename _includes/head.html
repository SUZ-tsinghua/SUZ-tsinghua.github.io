{% assign title = page.title | markdownify | strip_html | strip_newlines | escape_once %}
{% assign canonical_url = page.url | replace: "/index.html", "/" | absolute_url %}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ title }} - {{ site.title }}</title>
<link rel="canonical" href="{{ canonical_url }}">

<meta property="og:locale" content="{{ site.locale }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:url" content="{{ canonical_url }}">

<script type="application/ld+json">
  {
    "@context": "http://schema.org",
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ site.url | jsonify }}
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* Apply the saved or OS theme before the first paint, so dark mode does not flash light. main.js keeps it in sync. */
  try { var theme = localStorage.getItem("theme"); if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark"; } catch (e) {}
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ '/images/favicon-192x192.png' | relative_url }}" sizes="192x192">
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">
<meta name="theme-color" content="#ffffff">
